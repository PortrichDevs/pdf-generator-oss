<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  本番稼働イメージ (commit c4fcc6f) と同じフォント構成 (IPA 4 種 + DejaVu Sans) だけを使う。
  Amazon Linux 2023 では fontconfig の依存で Noto Sans が必ず入り、sans-serif の解決先が
  DejaVu Sans から Noto Sans に変わってしまうため、許可したフォント以外を無効にする。
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/*</glob>
    </rejectfont>
    <acceptfont>
      <glob>/usr/share/fonts/ipa-gothic-fonts*</glob>
      <glob>/usr/share/fonts/ipa-mincho-fonts*</glob>
      <glob>/usr/share/fonts/ipa-pgothic-fonts*</glob>
      <glob>/usr/share/fonts/ipa-pmincho-fonts*</glob>
      <glob>/usr/share/fonts/dejavu-sans-fonts*</glob>
    </acceptfont>
  </selectfont>
</fontconfig>
